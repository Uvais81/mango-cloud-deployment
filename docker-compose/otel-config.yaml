receivers:
  prometheus:
    config:
      scrape_configs:
        - job_name: 'cadvisor'
          static_configs:
            - targets: ['host.docker.internal:8081']

        - job_name: 'node'
          static_configs:
            - targets: ['host.docker.internal:9100']

        - job_name: 'postgres'
          static_configs:
            - targets: ['postgres-exporter:9187']

        - job_name: 'kafka'
          static_configs:
            - targets: ['kafka-exporter:9308']

exporters:
  prometheus:
    endpoint: "0.0.0.0:8889"

processors:
  batch:

service:
  pipelines:
    metrics:
      receivers: [prometheus]
      processors: [batch]
      exporters: [prometheus]

