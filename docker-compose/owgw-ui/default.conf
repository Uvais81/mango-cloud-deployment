server {
    listen       80;
    listen  [::]:80;

    # Disable emitting nginx version
    server_tokens off;

    return 301 https://$host$request_uri;
}

server {
    listen       443 ssl;
    listen       [::]:443 ssl;

    # Disable emitting nginx version
    server_tokens off;

    ssl_certificate     /etc/nginx/restapi-cert.pem;
    ssl_certificate_key /etc/nginx/restapi-key.pem;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
    }

    # Grafana proxy (must be outside other locations)
    location /grafana/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Prefix /grafana;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Resolve Grafana at request time so UI container can start even if Grafana is down.
        resolver 127.0.0.11 ipv6=off valid=30s;
        set $grafana_upstream http://grafana:3000;
        proxy_pass $grafana_upstream;
    }

    # AI Agent proxy (same-origin HTTPS -> internal AI service)
    location = /ai/chat {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        resolver 127.0.0.11 ipv6=off valid=30s;
        set $ai_upstream https://owgw-ai-agent:8787;
        proxy_ssl_verify off;
        proxy_pass $ai_upstream/ai/chat;
    }

    # Grafana control proxy (same-origin HTTPS -> internal AI service)
    location = /grafana/control {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        resolver 127.0.0.11 ipv6=off valid=30s;
        set $grafana_ctl_upstream http://grafana-controller:8788;
        proxy_pass $grafana_ctl_upstream/grafana/control;
    }

    location = /api/v1/grafana/control {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        resolver 127.0.0.11 ipv6=off valid=30s;
        set $grafana_ctl_upstream http://grafana-controller:8788;
        proxy_pass $grafana_ctl_upstream/api/v1/grafana/control;
    }

    # Monitoring stack control proxy (same-origin HTTPS -> monitoring control service)
    location = /monitoring/control {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        resolver 127.0.0.11 ipv6=off valid=30s;
        set $grafana_ctl_upstream http://grafana-controller:8788;
        proxy_pass $grafana_ctl_upstream/monitoring/control;
    }

    location = /api/v1/monitoring/control {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        resolver 127.0.0.11 ipv6=off valid=30s;
        set $grafana_ctl_upstream http://grafana-controller:8788;
        proxy_pass $grafana_ctl_upstream/api/v1/monitoring/control;
    }

    # Service control health proxy (same-origin HTTPS -> monitoring control service)
    location = /service-control/healthz {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        resolver 127.0.0.11 ipv6=off valid=30s;
        set $grafana_ctl_upstream http://grafana-controller:8788;
        proxy_pass $grafana_ctl_upstream/healthz;
    }

    location = /api/v1/service-control/healthz {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        resolver 127.0.0.11 ipv6=off valid=30s;
        set $grafana_ctl_upstream http://grafana-controller:8788;
        proxy_pass $grafana_ctl_upstream/healthz;
    }

    # AI Agent control proxy (same-origin HTTPS -> internal AI control service)
    location = /ai-agent/control {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        resolver 127.0.0.11 ipv6=off valid=30s;
        set $ai_ctl_upstream http://grafana-controller:8788;
        proxy_pass $ai_ctl_upstream/ai-agent/control;
    }

    location = /api/v1/ai-agent/control {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        resolver 127.0.0.11 ipv6=off valid=30s;
        set $ai_ctl_upstream http://grafana-controller:8788;
        proxy_pass $ai_ctl_upstream/api/v1/ai-agent/control;
    }

    # redirect server error pages to the static page /50x.html
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
